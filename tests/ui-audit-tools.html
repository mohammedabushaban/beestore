<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>BeeStore Audit Tools UI Tests</title>
  <style>
    body { font-family: monospace; padding: 16px; }
    .pass { color: #15803d; }
    .fail { color: #b91c1c; white-space: pre-wrap; }
    #test-page { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>BeeStore Audit Tools UI Tests</h1>
  <p>تبويب الضوابط والمراجعة، الميزانية، إعدام الدين وتطبيق الرصيد، وبطاقة إقفال السنة.</p>
  <div id="results"></div>
  <div id="test-page"></div>

  <script src="../js/core/namespace.js"></script>
  <script src="../js/core/config.js"></script>
  <script src="../js/core/money.js"></script>
  <script src="../js/core/dates.js"></script>
  <script src="../js/core/ids.js"></script>
  <script src="../js/core/validate.js"></script>
  <script src="../js/core/errors.js"></script>
  <script src="../js/core/chartSeed.js"></script>
  <script src="../js/storage/repository.js"></script>
  <script src="../js/storage/summary.js"></script>
  <script src="../js/storage/memoryRepository.js"></script>
  <script src="../js/services/settings.js"></script>
  <script src="../js/services/audit.js"></script>
  <script src="../js/services/accounts.js"></script>
  <script src="../js/services/chartOfAccounts.js"></script>
  <script src="../js/services/categories.js"></script>
  <script src="../js/services/products.js"></script>
  <script src="../js/services/variants.js"></script>
  <script src="../js/services/stock.js"></script>
  <script src="../js/services/sales.js"></script>
  <script src="../js/services/customers.js"></script>
  <script src="../js/services/returns.js"></script>
  <script src="../js/services/purchases.js"></script>
  <script src="../js/services/purchaseReturns.js"></script>
  <script src="../js/services/suppliers.js"></script>
  <script src="../js/services/expenses.js"></script>
  <script src="../js/services/payroll.js"></script>
  <script src="../js/services/employees.js"></script>
  <script src="../js/services/transactions.js"></script>
  <script src="../js/services/periods.js"></script>
  <script src="../js/services/journal.js"></script>
  <script src="../js/services/posting.js"></script>
  <script src="../js/services/journalIntegrity.js"></script>
  <script src="../js/services/yearEnd.js"></script>
  <script src="../js/services/auditReview.js"></script>
  <script src="../js/services/dailyClosing.js"></script>
  <script src="../js/services/reports.js"></script>
  <script src="../js/services/dashboard.js"></script>
  <script src="../js/services/backup.js"></script>
  <script src="../js/services/maintenance.js"></script>
  <script src="../js/services/scan.js"></script>
  <script src="../js/api/api.js"></script>
  <script src="../js/ui/components.js"></script>
  <script src="../js/ui/dialogs.js"></script>
  <script src="../js/ui/journalView.js"></script>
  <script src="../js/ui/scanner.js"></script>
  <script src="../js/ui/period.js"></script>
  <script src="../js/pages/reports.js"></script>
  <script src="../js/pages/customers.js"></script>
  <script src="../js/pages/periods.js"></script>
  <script>
    const results = document.getElementById('results');
    const state = { passed: 0, failed: 0, tests: [] };
    const pageErrors = [];

    function report(ok, name, detail) {
      state.tests.push({ name, ok, detail: detail || '' });
      const div = document.createElement('div');
      div.className = ok ? 'pass' : 'fail';
      div.textContent = (ok ? '✓ ' : '✗ ') + name + (detail ? ': ' + detail : '');
      results.appendChild(div);
      if (ok) state.passed++; else state.failed++;
      window.__testResults = state;
    }

    async function test(name, fn) {
      try {
        const detail = await fn();
        report(true, name, detail ? String(detail) : '');
      } catch (e) {
        report(false, name, (e && e.message) || String(e));
      }
    }

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function waitFor(fn, label, timeout) {
      const deadline = Date.now() + (timeout || 6000);
      let last = null;
      while (Date.now() < deadline) {
        try {
          const value = await fn();
          if (value) return value;
        } catch (e) { last = e; }
        await wait(40);
      }
      throw new Error('انتهت المهلة: ' + label + (last ? ' — ' + last.message : ''));
    }

    function buttonByText(root, text) {
      return Array.from(root.querySelectorAll('button'))
        .find(b => (b.textContent || '').trim() === text) || null;
    }

    function newContainer() {
      const container = document.createElement('div');
      document.getElementById('test-page').appendChild(container);
      return container;
    }

    let env;
    let navCalls = [];

    async function boot() {
      window.addEventListener('error', e => pageErrors.push('error: ' + (e.message || '')));
      window.addEventListener('unhandledrejection', e => {
        pageErrors.push('rejection: ' + ((e.reason && e.reason.message) || String(e.reason)));
      });
      const BeeStore = window.BeeStore;
      const repo = new BeeStore.MemoryRepository();
      await repo.open();
      const api = new BeeStore.Api(repo);
      BeeStore.repo = repo;
      BeeStore.api = api;
      localStorage.clear();
      const today = BeeStore.dates.today();
      const start = BeeStore.dates.addDays(today, -20);
      assert((await api.settings.save({ systemStartDate: start, blockFutureDates: true })).ok, 'settings');
      await BeeStore.settings.ensureDefaults();
      await BeeStore.chart.ensureSeeded();
      const product = (await api.products.quickAdd({
        name: 'قميص', barcode: '6281000000017', costMinor: 500, priceMinor: 1000,
        openingQuantity: 10, date: start,
      })).data;
      const customer = (await api.customers.create({ name: 'زبون آجل', phone: '0599000001' })).data;
      const sale = (await api.sales.create({
        date: today, customerId: customer.id,
        lines: [{ variantId: product.variant.id, qty: 2, unitPriceMinor: 1000 }],
      })).data;
      assert(sale && sale.dueMinor === 2000, 'credit sale');
      // A second, paid sale returned as customer credit.
      const paid = (await api.sales.create({
        date: today, customerId: customer.id,
        lines: [{ variantId: product.variant.id, qty: 1, unitPriceMinor: 1000 }],
        payments: [{ method: 'cash', amountMinor: 1000 }],
      })).data;
      assert((await api.returns.create({
        saleId: paid.id, date: today, lines: [{ saleLineIndex: 0, qty: 1 }], refundMode: 'customer_credit',
      })).ok, 'credit return');
      // A sale below cost for the anomaly report.
      assert((await api.sales.create({
        date: today, lines: [{ variantId: product.variant.id, qty: 1, unitPriceMinor: 300 }],
        payments: [{ method: 'cash', amountMinor: 300 }],
      })).ok, 'below cost sale');
      return { BeeStore, api, customer, sale };
    }

    const textOf = (node) => (node && node.textContent) || '';

    (async function run() {
      try {
        env = await boot();
        const { BeeStore, api, customer, sale } = env;

        await test('reports: controls tab lists anomalies and the historical review', async () => {
          const container = newContainer();
          await BeeStore.pages.reports.render(container);
          const tab = Array.from(container.querySelectorAll('.tab')).find(t => textOf(t) === 'ضوابط ومراجعة');
          assert(tab, 'تبويب الضوابط غير موجود');
          tab.click();
          await waitFor(() => textOf(container).indexOf('بيع بأقل من التكلفة (1)') >= 0, 'قسم البيع بأقل من التكلفة');
          await waitFor(() => textOf(container).indexOf('مراجعة البيانات المسجلة قبل إصلاحات التدقيق') >= 0, 'المراجعة التاريخية');
          assert(textOf(container).indexOf('لا توجد مستندات قديمة تأثرت') >= 0, 'بيانات جديدة يجب ألا تُظهر أخطاء قديمة');
        });

        await test('reports: balance sheet lines add up and it balances', async () => {
          const container = newContainer();
          await BeeStore.pages.reports.render(container);
          const tab = Array.from(container.querySelectorAll('.tab')).find(t => textOf(t) === 'الميزانية');
          tab.click();
          const btn = await waitFor(() => Array.from(container.querySelectorAll('button')).find(b => textOf(b) === 'عرض'), 'زر العرض');
          btn.click();
          await waitFor(() => textOf(container).indexOf('✓ الميزانية متوازنة') >= 0, 'الميزانية متوازنة');
          assert(textOf(container).indexOf('الخصوم + حقوق الملكية') >= 0, 'سطر المجموع');
          assert(textOf(container).indexOf('حقوق الملكية الافتتاحية') >= 0, 'حقوق الملكية الافتتاحية ظاهرة');
        });

        await test('customer statement: apply the credit, then write off the rest', async () => {
          const container = newContainer();
          await BeeStore.pages.customers.render(container);
          const stmtBtn = await waitFor(() => Array.from(container.querySelectorAll('button')).find(b => textOf(b) === 'كشف حساب'), 'زر كشف الحساب');
          stmtBtn.click();
          let dialog = await waitFor(() => document.querySelector('.dialog-overlay'), 'كشف الحساب');
          const applyBtn = await waitFor(() => Array.from(dialog.querySelectorAll('button')).find(b => textOf(b) === 'تطبيق الرصيد على الفواتير'), 'زر تطبيق الرصيد');
          applyBtn.click();
          await waitFor(async () => (await api.sales.get(sale.id)).data.dueMinor === 1000, 'تطبيق الرصيد على الفاتورة');
          dialog = await waitFor(() => {
            const d = document.querySelector('.dialog-overlay');
            return d && Array.from(d.querySelectorAll('button')).some(b => textOf(b) === 'إعدام الدين') ? d : null;
          }, 'كشف الحساب بعد التحديث');
          Array.from(dialog.querySelectorAll('button')).find(b => textOf(b) === 'إعدام الدين').click();
          const wo = await waitFor(() => Array.from(document.querySelectorAll('.dialog-overlay'))
            .find(d => textOf(d).indexOf('إعدام دين — فاتورة') >= 0), 'حوار الإعدام');
          wo.querySelector('input[placeholder^="مثال"]').value = 'غادر البلد';
          Array.from(wo.querySelectorAll('button')).find(b => textOf(b) === 'تأكيد الإعدام').click();
          await waitFor(async () => (await api.sales.get(sale.id)).data.dueMinor === 0, 'إعدام الباقي');
          const tb = (await api.journal.trialBalance({})).data;
          const bad = tb.accounts.find(a => a.code === '6410');
          assert(bad && bad.balanceMinor === 1000, 'مصروف الديون المعدومة 10.00');
          const integrity = (await api.maintenance.journalIntegrity()).data;
          assert(integrity.errors.length === 0, JSON.stringify(integrity.errors));
          document.querySelectorAll('.dialog-overlay').forEach(d => d.remove());
          void customer;
        });

        await test('periods: the fiscal-year card lists the current year as open', async () => {
          const container = newContainer();
          await BeeStore.pages.periods.render(container);
          await waitFor(() => textOf(container).indexOf('إقفال السنة المالية') >= 0, 'بطاقة إقفال السنة');
          const year = BeeStore.dates.today().slice(0, 4);
          assert(textOf(container.querySelector('#fiscal-years')).indexOf(year) >= 0, 'السنة الحالية غير معروضة');
          assert(textOf(container.querySelector('#fiscal-years')).indexOf('مفتوحة') >= 0, 'حالة السنة');
        });

        await test('no page errors during the flow', async () => {
          assert(pageErrors.length === 0, pageErrors.join(' | '));
        });
      } catch (e) {
        report(false, 'fatal', (e && e.message) || String(e));
      }
    })();
  </script>
</body>
</html>
