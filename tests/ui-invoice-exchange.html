<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>BeeStore Invoice Exchange UI Tests</title>
  <style>
    body { font-family: monospace; padding: 16px; }
    .pass { color: #15803d; }
    .fail { color: #b91c1c; white-space: pre-wrap; }
    #test-page { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>BeeStore Invoice Exchange UI Tests</h1>
  <p>عرض الاستبدال داخل الفاتورة الأصلية: الكمية الأصلية + الاستبدال، والصافي.</p>
  <div id="results"></div>
  <div id="test-page"></div>

  <script src="../js/core/namespace.js"></script>
  <script src="../js/core/config.js"></script>
  <script src="../js/core/money.js"></script>
  <script src="../js/core/dates.js"></script>
  <script src="../js/core/ids.js"></script>
  <script src="../js/core/validate.js"></script>
  <script src="../js/core/errors.js"></script>
  <script src="../js/core/chartSeed.js"></script>
  <script src="../js/storage/repository.js"></script>
  <script src="../js/storage/summary.js"></script>
  <script src="../js/storage/memoryRepository.js"></script>
  <script src="../js/services/settings.js"></script>
  <script src="../js/services/audit.js"></script>
  <script src="../js/services/accounts.js"></script>
  <script src="../js/services/chartOfAccounts.js"></script>
  <script src="../js/services/categories.js"></script>
  <script src="../js/services/products.js"></script>
  <script src="../js/services/variants.js"></script>
  <script src="../js/services/stock.js"></script>
  <script src="../js/services/sales.js"></script>
  <script src="../js/services/customers.js"></script>
  <script src="../js/services/returns.js"></script>
  <script src="../js/services/purchases.js"></script>
  <script src="../js/services/purchaseReturns.js"></script>
  <script src="../js/services/suppliers.js"></script>
  <script src="../js/services/expenses.js"></script>
  <script src="../js/services/payroll.js"></script>
  <script src="../js/services/employees.js"></script>
  <script src="../js/services/transactions.js"></script>
  <script src="../js/services/periods.js"></script>
  <script src="../js/services/journal.js"></script>
  <script src="../js/services/posting.js"></script>
  <script src="../js/services/dailyClosing.js"></script>
  <script src="../js/services/reports.js"></script>
  <script src="../js/services/dashboard.js"></script>
  <script src="../js/services/backup.js"></script>
  <script src="../js/services/maintenance.js"></script>
  <script src="../js/services/scan.js"></script>
  <script src="../js/api/api.js"></script>
  <script src="../js/ui/components.js"></script>
  <script src="../js/ui/dialogs.js"></script>
  <script src="../js/ui/journalView.js"></script>
  <script src="../js/ui/scanner.js"></script>
  <script src="../js/pages/invoices.js"></script>
  <script>
    const results = document.getElementById('results');
    const state = { passed: 0, failed: 0, tests: [] };
    const pageErrors = [];

    function report(ok, name, detail) {
      state.tests.push({ name, ok, detail: detail || '' });
      const div = document.createElement('div');
      div.className = ok ? 'pass' : 'fail';
      div.textContent = (ok ? '✓ ' : '✗ ') + name + (detail ? ': ' + detail : '');
      results.appendChild(div);
      if (ok) state.passed++; else state.failed++;
      window.__testResults = state;
    }

    async function test(name, fn) {
      try {
        const detail = await fn();
        report(true, name, detail ? String(detail) : '');
      } catch (e) {
        report(false, name, (e && e.message) || String(e));
      }
    }

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function waitFor(fn, label, timeout) {
      const deadline = Date.now() + (timeout || 6000);
      let last = null;
      while (Date.now() < deadline) {
        try {
          const value = await fn();
          if (value) return value;
        } catch (e) { last = e; }
        await wait(40);
      }
      throw new Error('انتهت المهلة: ' + label + (last ? ' — ' + last.message : ''));
    }

    function buttonByText(root, text) {
      return Array.from(root.querySelectorAll('button'))
        .find(b => (b.textContent || '').trim() === text) || null;
    }

    let env;

    async function boot() {
      window.addEventListener('error', e => pageErrors.push('error: ' + (e.message || '')));
      window.addEventListener('unhandledrejection', e => {
        pageErrors.push('rejection: ' + ((e.reason && e.reason.message) || String(e.reason)));
      });

      const BeeStore = window.BeeStore;
      const repo = new BeeStore.MemoryRepository();
      await repo.open();
      const api = new BeeStore.Api(repo);
      BeeStore.repo = repo;
      BeeStore.api = api;

      const today = BeeStore.dates.today();
      assert((await api.settings.save({
        systemStartDate: today,
        blockFutureDates: true,
      })).ok, 'settings');
      await BeeStore.settings.ensureDefaults();
      await BeeStore.chart.ensureSeeded();

      const acc = (await api.accounts.create({ name: 'Cash', type: 'cash' })).data;
      const productA = (await api.products.quickAdd({
        name: 'ترنج نفخ مواليد طيارة',
        barcode: '6281000000031',
        costMinor: 500,
        priceMinor: 1000,
        openingQuantity: 5,
        date: today,
      })).data;
      const productB = (await api.products.quickAdd({
        name: 'بجامة مواليد نفخ',
        barcode: '6281000000024',
        costMinor: 500,
        priceMinor: 1000,
        openingQuantity: 5,
        date: today,
      })).data;
      const variantA = productA.variant.id;
      const variantB = productB.variant.id;
      const sale = (await api.sales.create({
        date: today,
        lines: [
          { variantId: variantA, qty: 1, unitPriceMinor: 1000 },
          { variantId: variantB, qty: 1, unitPriceMinor: 1000 },
        ],
        payments: [{ method: 'cash', accountId: acc.id, amountMinor: 2000, date: today }],
      })).data;
      const ret = (await api.returns.create({
        saleId: sale.id,
        date: today,
        lines: [{ saleLineIndex: 0, qty: 1 }],
        refundMode: 'exchange',
        exchangeLines: [{ variantId: variantB, qty: 1, unitPriceMinor: 1000 }],
      })).data;
      const exchangeSale = (await api.sales.get(ret.exchangeSaleId)).data;
      return { BeeStore, api, productA, productB, sale, ret, exchangeSale, today };
    }

    (async function run() {
      try {
        env = await boot();
        const { BeeStore, sale, ret, exchangeSale } = env;
        const container = document.createElement('div');
        document.getElementById('test-page').appendChild(container);

        await test('the invoice list renders the original and exchange invoices', async () => {
          await BeeStore.pages.invoices.render(container);
          const text = container.textContent || '';
          assert(text.indexOf(sale.number) >= 0, 'الفاتورة الأصلية غير ظاهرة');
          assert(text.indexOf(exchangeSale.number) >= 0, 'فاتورة الاستبدال غير ظاهرة');
          return sale.number + ' / ' + exchangeSale.number;
        });

        await test('the original invoice shows +1 exchange and net quantity 2', async () => {
          const row = Array.from(container.querySelectorAll('tr'))
            .find(tr => (tr.textContent || '').indexOf(sale.number) >= 0);
          assert(row, 'صف الفاتورة الأصلية غير موجود');
          const view = buttonByText(row, 'عرض');
          assert(view, 'زر عرض الفاتورة غير موجود');
          view.click();
          const overlay = await waitFor(() => document.querySelector('.dialog-overlay'), 'حوار عرض الفاتورة');
          const text = overlay.textContent || '';
          assert(text.indexOf('+ 1 استبدال') >= 0, 'الاستبدال لم يظهر بجانب الكمية');
          assert(text.indexOf(exchangeSale.number) >= 0, 'رقم فاتورة الاستبدال غير ظاهر');
          assert(text.indexOf('الصافي: 2') >= 0, 'صافي الكمية يجب أن يكون 2');
          assert(text.indexOf('الاستبدال') >= 0, 'قسم الاستبدال غير ظاهر');
          assert(text.indexOf('الفاتورة الأصلية لا تتغير') >= 0, 'شرح ثبات الفاتورة الأصلية غير ظاهر');
          return 'صافي 2';
        });

        await test('the exchange card opens the separate exchange invoice', async () => {
          const overlay = document.querySelector('.dialog-overlay');
          assert(overlay, 'حوار الفاتورة غير مفتوح');
          const open = buttonByText(overlay, 'عرض');
          assert(open, 'زر عرض فاتورة الاستبدال غير موجود');
          open.click();
          const next = await waitFor(() => {
            const dialogs = document.querySelectorAll('.dialog-overlay');
            return dialogs.length === 1 ? dialogs[0] : null;
          }, 'حوار فاتورة الاستبدال');
          const text = next.textContent || '';
          assert(text.indexOf(exchangeSale.number) >= 0, 'فاتورة الاستبدال لم تُفتح');
          assert(text.indexOf('استبدال من ' + ret.number) >= 0, 'ملاحظة الاستبدال غير ظاهرة');
          next.querySelector('.btn-close').click();
          await waitFor(() => !document.querySelector('.dialog-overlay'), 'إغلاق الحوار');
          return exchangeSale.number;
        });

        await test('a later return of the exchange invoice reduces the net quantity', async () => {
          const { api, today, sale, exchangeSale } = env;
          const refund = (await api.returns.create({
            saleId: exchangeSale.id,
            date: today,
            lines: [{ saleLineIndex: 0, qty: 1 }],
            refundMode: 'cash_refund',
            refundPaymentMethod: 'cash',
          }));
          assert(refund.ok, 'تعذر إرجاع فاتورة الاستبدال');

          const refreshed = document.createElement('div');
          document.getElementById('test-page').appendChild(refreshed);
          await BeeStore.pages.invoices.render(refreshed);
          const row = Array.from(refreshed.querySelectorAll('tr'))
            .find(tr => (tr.textContent || '').indexOf(sale.number) >= 0);
          assert(row, 'صف الفاتورة الأصلية غير موجود بعد الإرجاع');
          buttonByText(row, 'عرض').click();
          const overlay = await waitFor(() => document.querySelector('.dialog-overlay'), 'حوار الفاتورة بعد إرجاع الاستبدال');
          const text = overlay.textContent || '';
          assert(text.indexOf('− 1 مرتجع استبدال') >= 0, 'مرتجع الاستبدال لم يظهر في الكمية');
          assert(text.indexOf('الصافي: 1') >= 0, 'صافي الكمية يجب أن يعود 1');
          overlay.querySelector('.btn-close').click();
          await waitFor(() => !document.querySelector('.dialog-overlay'), 'إغلاق الحوار');
          return 'صافي 1';
        });

        await test('no page errors during the flow', async () => {
          assert(pageErrors.length === 0, pageErrors.join(' | '));
          return '0';
        });
      } catch (e) {
        report(false, 'suite', (e && e.message) || String(e));
      } finally {
        window.__done = true;
      }
    })();
  </script>
</body>
</html>
