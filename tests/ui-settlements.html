<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>BeeStore A4 Settlement UI Tests</title>
  <style>
    body { font-family: monospace; padding: 16px; }
    .pass { color: #15803d; }
    .fail { color: #b91c1c; white-space: pre-wrap; }
    iframe { width: 1200px; height: 900px; border: 1px solid #ccc; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>BeeStore A4 UI Tests (Card / Wallet Settlements)</h1>
  <div id="results"></div>
  <iframe id="app-frame" src="../index.html"></iframe>
  <script>
    const results = document.getElementById('results');
    let passed = 0, failed = 0;
    const pageErrors = [];

    function report(ok, name, detail) {
      const div = document.createElement('div');
      div.className = ok ? 'pass' : 'fail';
      div.textContent = (ok ? '✓ ' : '✗ ') + name + (detail ? ': ' + detail : '');
      results.appendChild(div);
      if (ok) passed++; else failed++;
    }

    async function test(name, fn) {
      try {
        await fn();
        report(true, name);
      } catch (e) {
        report(false, name, (e && e.message) || String(e));
      }
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function waitFor(fn, label, timeout) {
      const deadline = Date.now() + (timeout || 20000);
      let lastError = null;
      while (Date.now() < deadline) {
        try {
          const value = await fn();
          if (value) return value;
        } catch (e) { lastError = e; }
        await wait(150);
      }
      throw new Error('انتهت المهلة: ' + label + (lastError ? ' — ' + lastError.message : ''));
    }

    function frame() { return document.getElementById('app-frame'); }
    function w() { return frame().contentWindow; }
    function d() { return frame().contentDocument; }

    function byText(root, selector, text) {
      return Array.from(root.querySelectorAll(selector))
        .find(node => (node.textContent || '').trim().indexOf(text) >= 0);
    }

    async function clickText(selector, text, label) {
      const btn = await waitFor(() => {
        const root = d();
        return root ? byText(root, selector, text) : null;
      }, label || ('زر ' + text));
      btn.click();
      return btn;
    }

    async function route(path, readyText) {
      w().BeeStore.router.navigate(path);
      await waitFor(() => {
        const root = d();
        if (!root) return false;
        const content = root.getElementById('page-content');
        return content && (content.textContent || '').indexOf(readyText) >= 0;
      }, 'الصفحة ' + path);
    }

    async function boot() {
      const frameEl = frame();
      if (frameEl.contentDocument && frameEl.contentDocument.readyState === 'complete' &&
        frameEl.contentWindow && frameEl.contentWindow.BeeStore) {
        // already loaded
      } else {
        await new Promise(resolve => { frameEl.addEventListener('load', resolve, { once: true }); });
      }
      const appWindow = w();
      appWindow.addEventListener('error', e => pageErrors.push('error: ' + (e.message || '')));
      appWindow.addEventListener('unhandledrejection', e => {
        pageErrors.push('rejection: ' + ((e.reason && e.reason.message) || String(e.reason)));
      });
      await waitFor(() => appWindow.BeeStore && appWindow.BeeStore.repo && appWindow.BeeStore.repo.opened,
        'فتح قاعدة البيانات');

      const wizard = d().getElementById('first-run-wizard');
      if (wizard && getComputedStyle(wizard).display !== 'none') {
        // The wizard binds its buttons during app init; retry until the
        // "start empty" click actually advances to the owner-PIN step.
        await waitFor(() => {
          d().getElementById('wizard-empty').click();
          const step = d().getElementById('wizard-step-4');
          return step && step.style.display === 'block';
        }, 'خطوة رمز المالك');
        const pin = d().getElementById('wizard-owner-pin');
        if (pin) {
          pin.value = '1357';
          d().getElementById('wizard-owner-pin-confirm').value = '1357';
          d().getElementById('wizard-start').click();
        }
      }
      await waitFor(() => d().getElementById('app').style.display === 'block', 'بدء التطبيق');
      await waitFor(() => d().querySelector('#page-content .page-title'), 'تحميل الصفحة الرئيسية');
      await appWindow.BeeStore.settings.ensureDefaults();
    }

    (async function run() {
      let api, money, today, sale, bankAccountId;
      try {
        await boot();
        const appWindow = w();
        const root = d();
        api = appWindow.BeeStore.api;
        money = appWindow.BeeStore.money;
        today = appWindow.BeeStore.dates.today();

        function ok(res, label) {
          if (!res || res.ok !== true) {
            throw new Error((label ? label + ': ' : '') +
              (res && res.error ? res.error.message : 'فشل غير معروف'));
          }
          return res.data;
        }

        await test('Sets up a 2% clearing card method and a card sale', async () => {
          const settings = ok(await api.settings.get(), 'settings');
          const methods = settings.paymentMethods.map(m => m.id === 'card'
            ? { ...m, kind: 'clearing', feeBasisPoints: 200, feeFixedMinor: 0, settlementDays: 2 }
            : m);
          ok(await api.settings.update({ paymentMethods: methods }), 'save methods');
          await appWindow.BeeStore.chart.ensureSeeded();
          const after = ok(await api.settings.get(), 'settings after seed');
          const card = after.paymentMethods.find(m => m.id === 'card');
          if (!card || card.kind !== 'clearing' || !card.chartAccountId) {
            throw new Error('طريقة البطاقة لم تحصل على حساب تسوية');
          }
          bankAccountId = after.defaultBankAccountId;
          if (!bankAccountId) throw new Error('لا يوجد حساب بنكي افتراضي');

          const product = ok(await api.products.create({
            name: 'منتج بطاقة', defaultCostMinor: 30000, defaultPriceMinor: 100000,
            date: today,
            variants: [{ size: 'M', color: 'أزرق', quantity: 5, costMinor: 30000, priceMinor: 100000 }],
          }), 'product');
          const variant = ok(await api.variants.list(), 'variants')
            .find(v => v.productId === product.id);
          sale = ok(await api.sales.create({
            date: today,
            lines: [{ variantId: variant.id, qty: 1, unitPriceMinor: 100000 }],
            payments: [{ method: 'card', amountMinor: 100000 }],
          }), 'card sale');
          if (sale.payments[0].methodKind !== 'clearing') {
            throw new Error('الدفعة لم تحمل لقطة clearing');
          }
        });

        await test('Settlement page shows the unsettled clearing balance, aging and expected fee', async () => {
          await route('/settlements', 'تسويات البطاقات والمحافظ');
          const content = await waitFor(() => {
            const node = root.getElementById('page-content');
            return node && node.textContent.indexOf('الرصيد غير المسوّى') >= 0 ? node : null;
          }, 'بطاقة طريقة البطاقة');
          await waitFor(() => content.textContent.indexOf(money.format(100000)) >= 0,
            'الرصيد غير المسوّى 1000.00');
          const text = content.textContent;
          if (text.indexOf('عمولات هذا الشهر') < 0) throw new Error('بطاقة عمولات الشهر غير ظاهرة');
          if (text.indexOf('معدل العمولة الفعلي') < 0) throw new Error('معدل العمولة غير ظاهر');
          if (text.indexOf('حساب التسوية مطابق') < 0) throw new Error('علامة المطابقة غير ظاهرة');
          if (text.indexOf(sale.number) < 0) throw new Error('إيصال الفاتورة غير ظاهر في الأعمار');
          if (text.indexOf('لا توجد تسويات مسجلة') < 0) throw new Error('السجل الفارغ غير ظاهر');
        });

        await test('New settlement dialog pre-fills gross, expected fee and net, then saves a balanced document', async () => {
          await clickText('button', '+ تسوية جديدة', 'زر تسوية جديدة');
          await waitFor(() => root.querySelector('.dialog'), 'حوار التسوية');
          const numbers = root.querySelectorAll('.dialog input[type="number"]');
          if (numbers.length < 3) throw new Error('حقول المبالغ غير مكتملة');
          await waitFor(() => numbers[0].value === '1000.00', 'تعبئة الإجمالي');
          if (numbers[1].value !== '20.00') throw new Error('العمولة المتوقعة لم تُعبأ: ' + numbers[1].value);
          if (numbers[2].value !== '980.00') throw new Error('الصافي المقترح لم يُعبأ: ' + numbers[2].value);
          await clickText('.dialog button', 'حفظ التسوية', 'حفظ التسوية');
          await waitFor(() => !root.querySelector('.dialog-overlay'), 'إغلاق حوار التسوية');
          const content = root.getElementById('page-content');
          await waitFor(() => content.textContent.indexOf('SET-000001') >= 0, 'ظهور التسوية في السجل');
          const text = content.textContent;
          if (text.indexOf('980.00') < 0) throw new Error('الصافي المستلم غير ظاهر في السجل');
          await waitFor(() => text.indexOf('لا توجد إيصالات غير مسوّاة') >= 0,
            'تصفير الإيصالات غير المسوّاة');
          const unsettledCard = Array.from(content.querySelectorAll('.stat-card'))
            .find(card => (card.textContent || '').indexOf('الرصيد غير المسوّى') >= 0);
          if (!unsettledCard || unsettledCard.textContent.indexOf('0.00') < 0) {
            throw new Error('الرصيد غير المسوّى لم يُصفَّر');
          }
        });

        await test('Voiding a settlement appends the reversal and restores the unsettled balance', async () => {
          const row = await waitFor(() => {
            const rows = Array.from(root.querySelectorAll('#page-content tbody tr'));
            return rows.find(tr => (tr.textContent || '').indexOf('SET-000001') >= 0) || null;
          }, 'صف التسوية');
          const voidButton = byText(row, 'button', 'إلغاء');
          if (!voidButton) throw new Error('زر الإلغاء غير موجود');
          voidButton.click();
          await waitFor(() => root.querySelector('.dialog'), 'حوار الإلغاء');
          const reason = root.querySelector('.dialog textarea');
          if (!reason) throw new Error('حقل سبب الإلغاء غير موجود');
          reason.value = 'كشف مكرر';
          await clickText('.dialog button', 'تأكيد الإلغاء', 'تأكيد الإلغاء');
          await waitFor(() => !root.querySelector('.dialog-overlay'), 'إغلاق حوار الإلغاء');
          const content = root.getElementById('page-content');
          await waitFor(() => content.textContent.indexOf('ملغاة') >= 0, 'حالة الإلغاء');
          await waitFor(() => {
            const card = Array.from(content.querySelectorAll('.stat-card'))
              .find(node => (node.textContent || '').indexOf('الرصيد غير المسوّى') >= 0);
            return card && card.textContent.indexOf(money.format(100000)) >= 0;
          }, 'عودة الرصيد غير المسوّى');
        });

        await test('Cashier cannot create or void a settlement through the facade', async () => {
          const auth = appWindow.BeeStore.auth;
          const owner = auth._profile;
          auth._profile = 'cashier';
          try {
            const res = await api.settlements.create({
              method: 'card', date: today, bankAccountId,
              grossMinor: 1000, feeMinor: 20, netReceivedMinor: 980,
            });
            if (res.ok) throw new Error('الكاشير استطاع إنشاء تسوية');
            if (res.error.code !== 'PERMISSION') {
              throw new Error('رمز الرفض غير متوقع: ' + res.error.code);
            }
          } finally {
            auth._profile = owner;
          }
        });

        await test('No uncaught page errors during the flow', async () => {
          if (pageErrors.length > 0) throw new Error(pageErrors.slice(0, 5).join(' | '));
        });

        results.appendChild(Object.assign(document.createElement('h2'), {
          textContent: 'Results: ' + passed + ' passed, ' + failed + ' failed',
        }));
      } catch (e) {
        report(false, 'fatal', (e && e.message) || String(e));
        results.appendChild(Object.assign(document.createElement('h2'), {
          textContent: 'Results: ' + passed + ' passed, ' + failed + ' failed',
        }));
      } finally {
        window.__testResults = { passed, failed, errors: pageErrors.slice() };
      }
    })();
  </script>
</body>
</html>
